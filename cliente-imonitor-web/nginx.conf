server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Tipos MIME explícitos para arquivos do Blazor
    location ~* \.wasm$ {
        root /usr/share/nginx/html;
        types { application/wasm wasm; }
    }

    location ~* \.js$ {
        root /usr/share/nginx/html;
        types { application/javascript js; }
    }

    location ~* \.css$ {
        root /usr/share/nginx/html;
        types { text/css css; }
    }
}